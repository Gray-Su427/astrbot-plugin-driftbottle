<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>漂流瓶管理</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">AstrBot Plugin Dashboard</p>
          <h1>🫧 漂流瓶管理</h1>
          <p class="lead">查看、删除和恢复漂流瓶。</p>
        </div>
        <div class="hero-card">
          <div class="hero-card-title">统计概览</div>
          <div id="stats" class="stats"></div>
          <div class="hero-card-actions">
            <button id="refreshBtn" class="secondary">刷新</button>
          </div>
        </div>
      </header>

      <main class="grid">
        <section class="panel panel--wide">
          <div class="panel-head">
            <h2>筛选</h2>
          </div>
          <div class="filter-bar">
            <label>
              <span>池子</span>
              <select id="poolFilter">
                <option value="public">大群瓶海</option>
              </select>
            </label>
            <label>
              <span>状态</span>
              <select id="statusFilter">
                <option value="all">全部</option>
                <option value="floating">漂流中</option>
                <option value="recalled">已收回</option>
              </select>
            </label>
          </div>
        </section>

        <section class="panel panel--wide">
          <div class="panel-head">
            <h2>瓶子列表</h2>
            <span id="countBadge" class="badge">加载中</span>
          </div>
          <div id="bottles" class="bottles"></div>
        </section>
      </main>

      <footer class="footer">
        <span>编号为投递时分配的永久序号，删除不影响其他瓶子编号。</span>
        <span id="message" class="message"></span>
      </footer>
    </div>

    <div id="confirmModal" class="confirm-modal" style="display:none;position:fixed;inset:0;align-items:center;justify-content:center;background:rgba(0,0,0,0.4);z-index:9999;">
      <div style="background:#fff;border-radius:8px;padding:16px;max-width:420px;width:90%;box-shadow:0 6px 24px rgba(0,0,0,0.2);">
        <div id="confirmModalText" style="margin-bottom:12px;color:#111;"></div>
        <div style="text-align:right;">
          <button id="confirmCancelBtn" class="ghost" style="margin-right:8px;">取消</button>
          <button id="confirmOkBtn" class="danger">确认</button>
        </div>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
